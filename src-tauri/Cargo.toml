[package]
name = "purgent"
version = "0.1.0"
edition = "2021"

[lib]
name = "purgent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
purgent-core = { path = "../crates/purgent-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
